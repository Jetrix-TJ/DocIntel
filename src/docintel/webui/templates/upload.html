{% extends "_base.html" %}
{% block content %}
  <p>Upload one invoice or bill - a PDF, a scanned image, or a Word/Excel
     document. It will be run through the real extraction pipeline
     (rule-engine only - the AI vision fallback is off).</p>
  <form method="post" action="{{ url_for('process') }}" enctype="multipart/form-data">
    <input type="file" name="pdf" accept=".pdf,.png,.jpg,.jpeg,.tiff,.tif,.bmp,.gif,.docx,.xlsx" required>
    <button type="submit">Process</button>
  </form>
  <p><a href="{{ url_for('review_list') }}">Review queue &rarr;</a></p>
{% endblock %}
