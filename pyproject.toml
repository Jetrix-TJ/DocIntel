[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel"
version = "0.1.0"
description = "Turn a vendor invoice or bill into a confidence-scored structured record, with a human in the loop only where the system says one is genuinely needed."
readme = "README.md"
authors = [{ name = "Techjays" }]
license = { text = "Proprietary - All Rights Reserved. Internal use only; not for external distribution." }
requires-python = ">=3.12"
dependencies = [
    "pdfplumber==0.11.9",
    "pytesseract>=0.3.10",
    "Pillow>=10.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]
# `pypdf` reads page count and enforces the byte/page ceilings before a PDF
# is sent to Gemini (adapters/vision/gemini_adapter.py::_read_pdf) - without
# it declared here, `docintel[vision]` installs clean and then fails with
# `ModuleNotFoundError: No module named 'pypdf'` the moment a real PDF is
# actually processed, not at install time.
vision = ["google-genai>=2.18", "python-dotenv>=1.0", "pypdf>=4.0"]
ui = ["flask>=3.0"]
export = ["openpyxl>=3.1"]
# `.msg` (Outlook's proprietary format) only - `.eml` parses with the stdlib
# `email` module. See src/docintel/adapters/intake/email.py.
email = ["extract-msg>=0.45"]
# `docintel generate-persona` (src/docintel/generation/persona_agent.py) - a
# draft-only, human-reviewed onboarding aid, not a runtime dependency of the
# real extraction pipeline. Separate from `vision`'s `google-genai`: Gemini
# reads the pages of documents already in the pipeline; this calls Claude,
# once per new vendor, to draft the field list a reviewer starts from.
generation = ["anthropic>=0.121", "pydantic>=2.0"]

# Not a pip dependency: `extract.convert.convert_office_to_pdf` (DOCX/XLSX ->
# PDF, for documents that arrive as Office files instead of PDFs) shells out
# to LibreOffice headless. Install `libreoffice` (or just
# `libreoffice-writer`/`libreoffice-calc`) on any host that runs `docintel
# process`/`docintel serve` and needs to accept those formats - a missing
# `soffice` binary fails that document loudly and per-document (a clear
# PermanentError), never silently, so its absence is safe to notice at
# deploy time rather than a hard build-time requirement.

[project.scripts]
docintel = "docintel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Runtime data a normal `.py`-only wheel would otherwise silently drop: the
# web UI's `templates/*.html`. No pack ships any `*.json`/`personas/*.json`
# here anymore - `PACK_MODULES`/`PACK_FILES` are both empty (see registry.py's
# own comment): docintel ships as a pure framework, zero pre-configured
# packs of any kind, real or synthetic. Declared per-package rather than a
# single blanket `"*": ["*"]` so a new pack or template directory is a
# one-line, reviewed addition to this list, not something that works by
# accident.
[tool.setuptools.package-data]
"docintel.webui" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "tests/fixtures/packs" is NOT shipped with docintel (see registry.py's
# PACK_MODULES comment) - it holds every pack this project's own test suite
# still needs: real, measured configuration for two real companies
# (northstar, digitaldirection), plus the two synthetic reference examples
# (spt_metals, acme_freight) that used to be shipped by default. Added here
# so a test that explicitly wants one can just `from northstar import PACK` -
# a single, visible, declarative pytest config entry, not a runtime sys.path
# mutation.
pythonpath = ["src", "tests/fixtures/packs"]
# Excluded from the default `pytest tests/` run - running anything under here
# is a deliberate, explicit act (`pytest tests/fixtures/packs/northstar/`),
# never automatic.
addopts = "--ignore=tests/fixtures"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
files = [
    "src/docintel/core",
    "src/docintel/grammar",
    # The signal registry a declarative ladder compiles against. Checked for the
    # same reason `grammar` is: it is a closed vocabulary other people's data
    # binds to, so its signatures are a contract rather than an implementation
    # detail. The rest of `packs/` is not checked yet - adding it is its own,
    # noisier task.
    "src/docintel/packs/signals.py",
    # The vision adapters are checked because they sit on an external SDK
    # boundary: every value that crosses it is untyped, and the whole design of
    # `policy.py` is about not trusting it.
    "src/docintel/adapters/vision",
]
python_version = "3.12"
strict = true

# `google-genai` is an optional extra (`pip install 'docintel[vision]'`). It is
# absent in the default dev environment on purpose - `--vision fake` and
# `--vision cassette` must work without it - so the import is unresolvable here
# rather than wrong. The lazy `from google import genai` inside `_resolve_client`
# is the only reference, and its result is handled as `Any` regardless.
[[tool.mypy.overrides]]
module = ["google.genai", "google.genai.*"]
ignore_missing_imports = true
