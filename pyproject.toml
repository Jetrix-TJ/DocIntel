[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber==0.11.9",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]
vision = ["anthropic>=0.40"]
ui = ["flask>=3.0"]

[project.scripts]
docintel = "docintel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
files = [
    "src/docintel/core",
    "src/docintel/grammar",
    # The vision adapters are checked because they sit on an external SDK
    # boundary: every value that crosses it is untyped, and the whole design of
    # `policy.py` is about not trusting it.
    "src/docintel/adapters/vision",
]
python_version = "3.12"
strict = true

# `anthropic` is an optional extra (`pip install 'docintel[vision]'`). It is
# absent in the default dev environment on purpose - `--vision fake` and
# `--vision cassette` must work without it - so the import is unresolvable here
# rather than wrong. The lazy `import anthropic` inside `_resolve_client` is the
# only reference, and its result is handled as `Any` regardless.
[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true
